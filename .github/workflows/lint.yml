name: Lint

on: [push, pull_request]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3

  r-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Install lintr and styler
        run: |
          install.packages(c("lintr", "styler"))
        shell: Rscript {0}
      - name: Run lintr
        run: |
          lintr::lint_dir(".")
        shell: Rscript {0}
      - name: Check styler formatting
        run: |
          styler::style_dir(".", dry = "fail")
        shell: Rscript {0}
