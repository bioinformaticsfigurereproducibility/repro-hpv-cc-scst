name: docker-build

on:
  push:
    branches: [main, setup/Dockerfile]
    paths: [Dockerfile, env.yaml, tests/**, .github/workflows/docker-build.yml]
  pull_request:
    paths: [Dockerfile, env.yaml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm -v "$PWD":/home/mambauser/repro-hpv-cc-scst \
            ghcr.io/${{ github.repository }}:latest Rscript tests/smoke_test.R

      - name: Push image
        if: github.event_name != 'pull_request'
        run: docker push ghcr.io/${{ github.repository }}:latest
