[tool.ruff]
line-length = 100
target-version = "py39"  # match whatever Python version your Docker image uses

exclude = [
    "data/",
    ".git",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports, undefined names, etc.)
    "I",   # isort (import sorting)
    "W",   # pycodestyle warnings
    "N",   # pep8-naming
    "UP",  # pyupgrade (modernize syntax)
]
ignore = [
    "E501",  # line too long — sometimes unavoidable with long scientific variable names/paths
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports OK in __init__ files