name: base
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.2.3
  - r-seurat=4.3.0
  - compilers
  - r-remotes
  # BayesSpace 1.6.0 dependencies (installed from source in the Dockerfile)
  # https://bioconductor.org/packages/3.15/bioc/html/BayesSpace.html
  # CRAN Packages
  - r-rcpp>=1.0.4.6
  - r-purrr
  - r-coda
  - r-matrix
  - r-assertthat
  - r-mclust
  - r-rcurl
  - r-dirichletreg
  - r-xgboost
  - r-ggplot2
  - r-scales
  - r-rcpparmadillo
  - r-rcppdist
  - r-rcppprogress
  # Bioconductor Packages
  - bioconductor-singlecellexperiment=1.20.0
  - bioconductor-scater
  - bioconductor-scran
  - bioconductor-summarizedexperiment
  - bioconductor-rhdf5
  - bioconductor-s4vectors
  - bioconductor-biocfilecache
  - bioconductor-biocsingular
  # Monocle2 2.26.0 Pseudotime trajectory analysis
  - bioconductor-monocle=2.26.0
  # AUCell 1.20.2 dependencies (installed from source in the Dockerfile)
  # https://bioconductor.org/packages/3.16/bioc/html/AUCell.html
  - r-data.table
  - r-mixtools
  - r-r.utils
  - r-shiny
  - bioconductor-delayedarray
  - bioconductor-delayedmatrixstats
  - bioconductor-gseabase
  - bioconductor-biocgenerics
  - python=3.10
  # ReactomePA 1.42.0 Pathway enrichment
  - bioconductor-reactomepa=1.42.0
  # CIBERSORT dependencies (script itself is licensed; obtained separately)
  - r-e1071
  - bioconductor-preprocesscore
  # ESTIMATE Stromal/immune scoring
  - r-estimate
  # Cox Regression + Lasso glmnet Prognostic signature construction
  - r-glmnet
  - r-survival


