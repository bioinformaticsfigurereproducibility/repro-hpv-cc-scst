name: base
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.2.3
  - r-seurat=4.3.0
  - compilers
# BayesSpace 1.6.0 dependencies (installed from source in the Dockerfile)
# https://bioconductor.org/packages/3.15/bioc/html/BayesSpace.html
  # CRAN Packages
  - r-rcpp>=1.0.4.6
  - r-purrr
  - r-coda
  - r-matrix
  - r-assertthat
  - r-mclust
  - r-rcurl
  - r-dirichletreg
  - r-xgboost
  - r-ggplot2
  - r-scales
  - r-rcpparmadillo
  - r-rcppdist
  - r-rcppprogress
  # Bioconductor Packages
  - bioconductor-singlecellexperiment=1.20.0
  - bioconductor-scater
  - bioconductor-scran
  - bioconductor-summarizedexperiment
  - bioconductor-rhdf5
  - bioconductor-s4vectors
  - bioconductor-biocfilecache
  - bioconductor-biocsingular
  - python
